[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-os"
version = "0.2.0"
description = "Agent OS x PayPal: governed, typed PayPal functions for AI agents (Sentinel)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "jsonschema>=4.21",
    "typer>=0.12",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5"]

[project.scripts]
agentos = "cli.main:app"

[tool.setuptools]
packages = [
    "daemon",
    "daemon.api",
    "daemon.governance",
    "daemon.storage",
    "converters",
    "converters.mock",
    "paypal_adapter",
    "paypal_adapter.overrides",
    "paypal_adapter.sandbox",
    "agents",
    "worker",
    "cli",
]

[tool.setuptools.package-data]
"daemon.storage" = ["migrations/*.sql"]
"paypal_adapter" = ["specs/*.json"]
"agents" = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"cli/main.py" = ["UP007", "UP045"]     # Typer reads Optional[...] reliably on every Python version
"tests/*" = ["E501", "B018"]
